<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc">
<title id="title">How save_atomic writes a file</title>
<desc id="desc">save_atomic creates a unique temp file in the target directory, writes the JSON, fsyncs it, then os.replace renames it over the target. Readers see the old file or the new one. If anything raises before the rename, the temp file is deleted and the original is untouched.</desc>
<rect width="600" height="580" rx="20" fill="#16191D"/>
<text x="32" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#E9E7E2" font-weight="700">save_atomic(&quot;data/clinics.json&quot;, data)</text>
<rect x="32" y="88" width="290" height="88" rx="12" fill="#1F2328" stroke="#353B42" stroke-width="2"/>
<text x="52" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#E9E7E2" font-weight="700">mkstemp</text>
<text x="52" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#A0A7AF">temp file, same dir</text>
<path d="M177 182 V206 M169 196 L177 206 L185 196" stroke="#A0A7AF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="212" width="290" height="88" rx="12" fill="#1F2328" stroke="#353B42" stroke-width="2"/>
<text x="52" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#E9E7E2" font-weight="700">json.dump</text>
<text x="52" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#A0A7AF">ensure_ascii=False</text>
<path d="M177 306 V330 M169 320 L177 330 L185 320" stroke="#A0A7AF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="336" width="290" height="88" rx="12" fill="#1F2328" stroke="#353B42" stroke-width="2"/>
<text x="52" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#E9E7E2" font-weight="700">fsync</text>
<text x="52" y="406" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#A0A7AF">bytes reach disk</text>
<path d="M177 430 V454 M169 444 L177 454 L185 444" stroke="#A0A7AF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="32" y="460" width="290" height="88" rx="12" fill="#1F2328" stroke="#7CC9A2" stroke-width="2"/>
<text x="52" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#7CC9A2" font-weight="700">os.replace</text>
<text x="52" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#A0A7AF">atomic rename</text>
<path d="M322 132 H352 M322 256 H352 M322 380 H352 M352 132 V380" stroke="#EE9A62" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
<text x="370" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#EE9A62">anything raises:</text>
<text x="370" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#EE9A62">temp file deleted,</text>
<text x="370" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#EE9A62">data/clinics.json</text>
<text x="370" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#EE9A62">untouched,</text>
<text x="370" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="20" fill="#EE9A62">error re-raised</text>
</svg>
