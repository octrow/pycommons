[project]
name = "pycommons"
version = "0.1.0"
description = "The small utilities duplicated across ~7 repos: setup_logging, load_env, sqlite open, atomic JSON store, slugify"
requires-python = ">=3.12"
dependencies = []  # stdlib only, on purpose

[project.optional-dependencies]
# Only `logsetup`'s console sink uses rich, and only if importable.
rich = ["rich>=13"]
dev = ["pytest>=8", "rich>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycommons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
